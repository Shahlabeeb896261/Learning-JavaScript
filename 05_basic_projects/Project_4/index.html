<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Number Guessing Game</title>
</head>
<body>
    <div class="container">
        <div class="heading">
            <h1>Number Guessing Name</h1>
        </div>
        <div class="about-game">
            <p>If you want to win! then you have to guess the correct Number in 10 attempts.</p>
        </div>
        <form class="content">
            <label for="userInput">Enter a Number</label>
            <input type="text" placeholder="Enter a Number" id="userInput" class="userInput">
            <input type="submit" value="Submit" class="submit-btn">
        </form>
        <div class="rules">
            <div class="valid-num"></div>
            <div class="game-message"></div>
            <div class="previous-guesses">
                <p>Previous Guesses: <span class="prev-show"></span></p>
            </div>
            <div class="attempts-left">
                <p>Attempts left: <span class="num-attempt-left">10</span></p>
            </div>
        </div>
        <div class="newgame-btn">
            <!-- <button class="new-gameBtn"></button> -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
